name: Download Cursor Installer

on:
  workflow_dispatch:          # 手动触发（推荐）
  # schedule:                 # 需要定时可取消注释
  #   - cron: '0 2 * * 1'     # 每周一 UTC 02:00

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download file
        run: |
          mkdir -p output
          curl -L --fail --retry 3 \
            -o output/CursorUserSetup-x64-3.25.6.exe \
            "https://downloads.cursor.com/production/f0df777c412b670d09e3eaf214967d779e67c088/win32/x64/user-setup/CursorUserSetup-x64-3.25.6.exe"
          ls -lh output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CursorUserSetup-x64-3.25.6
          path: output/CursorUserSetup-x64-3.25.6.exe
          retention-days: 30   # 保留天数，最长 90
