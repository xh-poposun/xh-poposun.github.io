name: Download and Release Cursor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download file
        run: |
          curl -L --fail --retry 3 \
            -o CursorUserSetup-x64-3.25.6.exe \
            "https://downloads.cursor.com/production/f0df777c412b670d09e3eaf214967d779e67c088/win32/x64/user-setup/CursorUserSetup-x64-3.25.6.exe"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cursor-3.25.6
          name: Cursor 3.25.6
          body: "Cursor User Setup x64 3.25.6"
          files: CursorUserSetup-x64-3.25.6.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
